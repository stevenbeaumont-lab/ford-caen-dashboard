<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sello Caen — Dashboard Ford</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 100%);
  color: #fff;
  min-height: 100vh;
}

/* === LOGIN SCREEN === */
.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.login-box {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo h1 {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, #003478 0%, #0066cc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.login-logo p {
  color: rgba(255,255,255,0.6);
  font-size: 14px;
}
.login-form label {
  display: block;
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 8px;
  font-weight: 500;
}
.login-form input,
.login-form select {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  margin-bottom: 20px;
  transition: all 0.2s;
}
.login-form input:focus,
.login-form select:focus {
  outline: none;
  border-color: #0066cc;
  background: rgba(255,255,255,0.12);
}
.login-form button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #003478 0%, #0066cc 100%);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.login-form button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0,102,204,0.4);
}
.login-error {
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}

/* === MAIN DASHBOARD === */
.app { display: none; }
.app.active { display: block; }

.header {
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, #003478 0%, #0066cc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.user-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.06);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
}
.user-badge.admin { background: rgba(0,102,204,0.2); border: 1px solid rgba(0,102,204,0.4); }
.user-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #10b981;
}
.btn-logout {
  background: rgba(239,68,68,0.15);
  border: 1px solid rgba(239,68,68,0.3);
  color: #fca5a5;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-logout:hover {
  background: rgba(239,68,68,0.25);
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 32px 24px;
}

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.kpi-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #003478, #0066cc);
}
.kpi-label {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.kpi-value {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 4px;
}
.kpi-sublabel {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.04);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 24px;
  overflow-x: auto;
}
.tab {
  padding: 10px 18px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab.active {
  background: linear-gradient(135deg, #003478, #0066cc);
  color: white;
}
.tab:not(.active):hover {
  background: rgba(255,255,255,0.06);
  color: white;
}

/* Cards */
.card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Table */
.table-wrapper {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th {
  background: rgba(255,255,255,0.05);
  padding: 14px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: rgba(255,255,255,0.7);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
td {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
tr:hover td { background: rgba(255,255,255,0.03); }
tr:last-child td { border-bottom: none; }

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.badge-vendu { background: rgba(16,185,129,0.2); color: #6ee7b7; }
.badge-perdu { background: rgba(239,68,68,0.2); color: #fca5a5; }
.badge-encours { background: rgba(245,158,11,0.2); color: #fcd34d; }
.badge-reporte { background: rgba(168,85,247,0.2); color: #d8b4fe; }

/* Vendeur Card */
.vendeur-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.vendeur-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  position: relative;
}
.vendeur-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}
.vendeur-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 16px;
}
.vendeur-stat {
  text-align: center;
  padding: 10px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
}
.vendeur-stat-value { font-size: 22px; font-weight: 700; }
.vendeur-stat-label { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }

.progress-bar {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 12px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #003478, #0066cc);
  border-radius: 3px;
  transition: width 0.5s;
}

.loading {
  text-align: center;
  padding: 60px;
  color: rgba(255,255,255,0.5);
}

@media (max-width: 768px) {
  .container { padding: 16px; }
  .kpi-value { font-size: 28px; }
  .header { padding: 12px 16px; }
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>Sello Caen</h1>
      <p>Dashboard Ford • Connexion</p>
    </div>
    <div id="loginError" class="login-error"></div>
    <div class="login-form">
      <label>Profil</label>
      <select id="loginRole">
        <option value="">— Sélectionner —</option>
        <option value="admin">Administrateur (Steven)</option>
        <option value="vendeur">Vendeur</option>
      </select>
      
      <div id="vendeurSelectGroup" style="display:none;">
        <label>Vendeur</label>
        <select id="loginVendeur">
          <option value="">— Sélectionner —</option>
        </select>
      </div>
      
      <label>Code d'accès</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      
      <button id="loginBtn">Se connecter</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="app">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">Sello Caen</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div id="userBadge" class="user-badge">
        <div class="user-dot"></div>
        <span id="userName">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="container">
    <!-- KPI -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="vue">📊 Vue d'ensemble</button>
      <button class="tab" data-tab="vendeurs">👥 Vendeurs</button>
      <button class="tab" data-tab="deals">📋 Affaires</button>
      <button class="tab" data-tab="stats">📈 Activité</button>
    </div>

    <!-- Contenu Vue -->
    <div id="tab-vue" class="tab-content">
      <div class="card">
        <div class="card-title">🏆 Classement du mois</div>
        <div id="classement"></div>
      </div>
    </div>

    <div id="tab-vendeurs" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title">👥 Équipe vendeurs</div>
        <div class="vendeur-grid" id="vendeursGrid"></div>
      </div>
    </div>

    <div id="tab-deals" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title">📋 Affaires en cours et récentes</div>
        <div class="table-wrapper">
          <table id="dealsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Vendeur</th>
                <th>Client</th>
                <th>Véhicule</th>
                <th>Financement</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-stats" class="tab-content" style="display:none;">
      <div class="card">
        <div class="card-title">📈 Activité journalière</div>
        <div class="table-wrapper">
          <table id="statsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Vendeur</th>
                <th>Ventes</th>
                <th>Appels</th>
                <th>Essais</th>
                <th>Livraisons</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// === CONFIG ===
const SUPABASE_URL = 'https://xhedsjsnurmjtgdsaiwf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZWRzanNudXJtanRnZHNhaXdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjgzNjYsImV4cCI6MjA5NjYwNDM2Nn0.L0nLTKwzH2tjjUsIDZ-9w90Xs3YFXaVhxTu5fHZea0s';

const ADMIN_PASSWORD = 'ford2026';
const VENDEUR_PASSWORD = 'sello';

let supabase = null;
try {
  if (window.supabase && window.supabase.createClient) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    console.error('Supabase non chargé');
  }
} catch(e) {
  console.error('Erreur init Supabase:', e);
}

let currentUser = null;
let state = { vendeurs: [], deals: [], stats: [], objectifs: [] };

// === LOGIN ===
document.getElementById('loginRole').addEventListener('change', async (e) => {
  const role = e.target.value;
  const grp = document.getElementById('vendeurSelectGroup');
  if (role === 'vendeur') {
    grp.style.display = 'block';
    if (!supabase) {
      showError('Connexion à la base impossible — recharge la page');
      return;
    }
    try {
      const { data, error } = await supabase.from('vendeurs').select('name').order('name');
      if (error) throw error;
      const select = document.getElementById('loginVendeur');
      select.innerHTML = '<option value="">— Sélectionner —</option>';
      (data || []).forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = v.name;
        select.appendChild(opt);
      });
    } catch(err) {
      console.error('Erreur chargement vendeurs:', err);
      showError('Erreur de chargement des vendeurs');
    }
  } else {
    grp.style.display = 'none';
  }
});

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});

function showError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

function login() {
  const role = document.getElementById('loginRole').value;
  const password = document.getElementById('loginPassword').value;
  const vendeur = document.getElementById('loginVendeur').value;

  if (!role) return showError('Sélectionne un profil');
  if (!password) return showError('Saisis le code d\'accès');

  if (role === 'admin' && password === ADMIN_PASSWORD) {
    currentUser = { role: 'admin', name: 'Steven (Admin)' };
  } else if (role === 'vendeur' && password === VENDEUR_PASSWORD && vendeur) {
    currentUser = { role: 'vendeur', name: vendeur };
  } else {
    return showError('Code incorrect ou vendeur non sélectionné');
  }

  localStorage.setItem('selloUser', JSON.stringify(currentUser));
  startApp();
}

function logout() {
  localStorage.removeItem('selloUser');
  currentUser = null;
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').style.display = 'none';
}

async function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userBadge').classList.toggle('admin', currentUser.role === 'admin');
  
  try {
    await loadData();
    render();
  } catch(err) {
    console.error('Erreur chargement:', err);
    alert('Erreur de chargement des données: ' + err.message);
  }
}

async function loadData() {
  if (!supabase) throw new Error('Supabase non initialisé');
  
  const [v, d, s, o] = await Promise.all([
    supabase.from('vendeurs').select('*').order('name'),
    supabase.from('deals').select('*').order('date', { ascending: false }),
    supabase.from('stats_journalieres').select('*').order('date', { ascending: false }),
    supabase.from('objectifs').select('*')
  ]);

  if (v.error) console.error('Vendeurs:', v.error);
  if (d.error) console.error('Deals:', d.error);
  if (s.error) console.error('Stats:', s.error);
  if (o.error) console.error('Objectifs:', o.error);

  state.vendeurs = v.data || [];
  state.deals = d.data || [];
  state.stats = s.data || [];
  state.objectifs = o.data || [];

  // Filtrer si vendeur
  if (currentUser.role === 'vendeur') {
    state.deals = state.deals.filter(x => x.vendeur === currentUser.name);
    state.stats = state.stats.filter(x => x.vendeur === currentUser.name);
  }
}

function render() {
  renderKPIs();
  renderClassement();
  renderVendeurs();
  renderDeals();
  renderStats();
}

function renderKPIs() {
  const now = new Date();
  const moisCourant = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  
  const dealsMois = state.deals.filter(d => d.date && d.date.startsWith(moisCourant));
  const vendusMois = dealsMois.filter(d => d.statut === 'Vendu').length;
  const enCoursMois = dealsMois.filter(d => d.statut === 'En cours').length;
  const totalDeals = state.deals.length;
  
  const objMois = state.objectifs
    .filter(o => o.mois === moisCourant && (currentUser.role === 'admin' || o.vendeur === currentUser.name))
    .reduce((s,o) => s + o.objectif, 0);

  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Ventes du mois</div>
      <div class="kpi-value">${vendusMois}</div>
      <div class="kpi-sublabel">${objMois > 0 ? `Objectif: ${objMois}` : '—'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">En cours</div>
      <div class="kpi-value">${enCoursMois}</div>
      <div class="kpi-sublabel">Affaires actives</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total affaires</div>
      <div class="kpi-value">${totalDeals}</div>
      <div class="kpi-sublabel">${currentUser.role === 'admin' ? 'Toute l\'équipe' : 'Tes affaires'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Taux conversion</div>
      <div class="kpi-value">${dealsMois.length ? Math.round(vendusMois/dealsMois.length*100) : 0}%</div>
      <div class="kpi-sublabel">Ce mois</div>
    </div>
  `;
}

function renderClassement() {
  const now = new Date();
  const moisCourant = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  
  const ventesParVendeur = {};
  state.deals
    .filter(d => d.date && d.date.startsWith(moisCourant) && d.statut === 'Vendu')
    .forEach(d => {
      ventesParVendeur[d.vendeur] = (ventesParVendeur[d.vendeur] || 0) + 1;
    });

  const classement = Object.entries(ventesParVendeur)
    .sort((a,b) => b[1] - a[1]);

  const el = document.getElementById('classement');
  if (classement.length === 0) {
    el.innerHTML = '<p style="color:rgba(255,255,255,0.5);">Aucune vente ce mois-ci.</p>';
    return;
  }

  el.innerHTML = classement.map(([vendeur, ventes], i) => {
    const medals = ['🥇','🥈','🥉'];
    const vendeurData = state.vendeurs.find(v => v.name === vendeur);
    const obj = state.objectifs.find(o => o.vendeur === vendeur && o.mois === moisCourant)?.objectif || vendeurData?.objectif || 18;
    const pct = Math.min(100, Math.round(ventes/obj*100));
    return `
      <div style="display:flex; align-items:center; gap:16px; padding:14px; background:rgba(255,255,255,0.03); border-radius:12px; margin-bottom:10px;">
        <div style="font-size:24px; min-width:40px;">${medals[i] || `#${i+1}`}</div>
        <div style="flex:1;">
          <div style="font-weight:600; margin-bottom:6px;">${vendeur}</div>
          <div class="progress-bar" style="margin-top:0;">
            <div class="progress-fill" style="width:${pct}%; background:${vendeurData?.color || '#0066cc'};"></div>
          </div>
        </div>
        <div style="text-align:right; min-width:80px;">
          <div style="font-size:22px; font-weight:700;">${ventes}</div>
          <div style="font-size:11px; color:rgba(255,255,255,0.5);">/ ${obj}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderVendeurs() {
  const now = new Date();
  const moisCourant = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  
  const vendeursToShow = currentUser.role === 'admin' 
    ? state.vendeurs 
    : state.vendeurs.filter(v => v.name === currentUser.name);

  const grid = document.getElementById('vendeursGrid');
  grid.innerHTML = vendeursToShow.map(v => {
    const ventes = state.deals.filter(d => d.vendeur === v.name && d.date?.startsWith(moisCourant) && d.statut === 'Vendu').length;
    const enCours = state.deals.filter(d => d.vendeur === v.name && d.statut === 'En cours').length;
    const obj = state.objectifs.find(o => o.vendeur === v.name && o.mois === moisCourant)?.objectif || v.objectif;
    const pct = Math.min(100, Math.round(ventes/obj*100));
    
    return `
      <div class="vendeur-card" style="border-left:3px solid ${v.color}">
        <div class="vendeur-name">${v.name}</div>
        <div style="font-size:12px; color:rgba(255,255,255,0.6);">Objectif mensuel: ${obj}</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%; background:${v.color};"></div>
        </div>
        <div style="font-size:12px; color:rgba(255,255,255,0.6); margin-top:6px;">${pct}% de l'objectif</div>
        <div class="vendeur-stats">
          <div class="vendeur-stat">
            <div class="vendeur-stat-value">${ventes}</div>
            <div class="vendeur-stat-label">Ventes mois</div>
          </div>
          <div class="vendeur-stat">
            <div class="vendeur-stat-value">${enCours}</div>
            <div class="vendeur-stat-label">En cours</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderDeals() {
  const tbody = document.querySelector('#dealsTable tbody');
  const dealsToShow = state.deals.filter(d => !d.archived).slice(0, 50);
  
  if (dealsToShow.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Aucune affaire active</td></tr>';
    return;
  }

  tbody.innerHTML = dealsToShow.map(d => {
    let badgeClass = 'badge-encours';
    if (d.statut === 'Vendu') badgeClass = 'badge-vendu';
    else if (d.statut === 'Perdu') badgeClass = 'badge-perdu';
    else if (d.statut === 'Reporté') badgeClass = 'badge-reporte';
    
    return `
      <tr>
        <td>${formatDate(d.date)}</td>
        <td>${d.vendeur}</td>
        <td><strong>${d.client}</strong></td>
        <td>${d.vehicule}</td>
        <td>${d.financement}</td>
        <td><span class="badge ${badgeClass}">${d.statut}</span></td>
      </tr>
    `;
  }).join('');
}

function renderStats() {
  const tbody = document.querySelector('#statsTable tbody');
  const statsToShow = state.stats.slice(0, 50);
  
  if (statsToShow.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Aucune activité</td></tr>';
    return;
  }

  tbody.innerHTML = statsToShow.map(s => `
    <tr>
      <td>${formatDate(s.date)}</td>
      <td>${s.vendeur}</td>
      <td>${s.ventes || 0}</td>
      <td>${s.appels || 0}</td>
      <td>${s.essais || 0}</td>
      <td>${s.livraisons || 0}</td>
    </tr>
  `).join('');
}

function formatDate(d) {
  if (!d) return '—';
  const date = new Date(d);
  return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
}

// === TABS ===
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const target = t.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + target).style.display = 'block';
  });
});

// === AUTO-LOGIN ===
const saved = localStorage.getItem('selloUser');
if (saved) {
  try {
    currentUser = JSON.parse(saved);
    startApp();
  } catch(e) {}
}
</script>
